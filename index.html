    const IconChevronUp = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
    );

    const ERP_DEFAULTS = {
      agendaOrcamento: '196',
      fornecedor: '11697-1',
      agenda: '349',
      cfop: '820',
      obsTemplate: 'REF. CONTROLE DE ENTREGAS LOJA {LOJA} PERIODO {PERIODO}.',
    };

    function formatCurrencyBRL(num) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 }).format(num || 0);
    }

    function formatDateBR(isoStr) {
      if (!isoStr) return '';
      const p = isoStr.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : isoStr;
    }

    function getUpcomingFriday(from = new Date()) {
      const d = new Date(from);
      const diff = (5 - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      return d;
    }

    function getNextFridayAfter(from) {
      const d = new Date(from);
      d.setDate(d.getDate() + 7);
      return d;
    }

    function formatDateToISO(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function isFriday(isoStr) {
      if (!isoStr) return false;
      const p = isoStr.split('-');
      if (p.length !== 3) return false;
      const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
      return d.getDay() === 5;
    }

    const INITIAL_NOTES = [
      { id: '1', data: '2026-10-16', lojaNumero: '01', lojaNome: 'Matriz Centro', numeroPedido: 'PED-48201', numeroGerado: 'GER-918234', valor: 2450.00, status: 'pendente', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 01 PERIODO 09-16/10.' },
      { id: '2', data: '2026-10-16', lojaNumero: '04', lojaNome: 'Filial Shopping Sul', numeroPedido: 'PED-48215', numeroGerado: 'GER-918235', valor: 1380.50, status: 'lancado', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 04 PERIODO 09-16/10.', lancadoEm: '2026-10-13T14:15:00.000Z' },
      { id: '3', data: '2026-10-16', lojaNumero: '08', lojaNome: 'Loja 08 Zona Norte', numeroPedido: 'PED-48229', numeroGerado: 'GER-918241', valor: 890.00, status: 'pendente', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 08 PERIODO 09-16/10.' },
      { id: '4', data: '2026-10-16', lojaNumero: '12', lojaNome: 'Boulevard Leste', numeroPedido: 'PED-48250', numeroGerado: 'GER-918255', valor: 3720.00, status: 'lancado', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 12 PERIODO 09-16/10.', lancadoEm: '2026-10-14T10:00:00.000Z' },
      { id: '5', data: '2026-10-16', lojaNumero: '15', lojaNome: 'Galeria Central', numeroPedido: 'PED-48264', numeroGerado: 'GER-918260', valor: 640.25, status: 'pendente', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 15 PERIODO 09-16/10.' },
      { id: '6', data: '2026-10-23', lojaNumero: '01', lojaNome: 'Matriz Centro', numeroPedido: 'PED-48302', numeroGerado: 'GER-918288', valor: 4150.00, status: 'pendente', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 01 PERIODO 16-23/10.' },
      { id: '7', data: '2026-10-23', lojaNumero: '22', lojaNome: 'Centro de Distribuição', numeroPedido: 'PED-48318', numeroGerado: 'GER-918295', valor: 1980.00, status: 'pendente', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 22 PERIODO 16-23/10.' },
      { id: '8', data: '2026-10-09', lojaNumero: '08', lojaNome: 'Loja 08 Zona Norte', numeroPedido: 'PED-48099', numeroGerado: 'GER-917990', valor: 1250.00, status: 'lancado', observacoes: 'REF. CONTROLE DE ENTREGAS LOJA 08 PERIODO 02-09/10.', lancadoEm: '2026-10-09T16:20:00.000Z' }
    ];

    function App() {
      const [notes, setNotes] = useState(() => {
        try {
          const s = localStorage.getItem('controle_notas_lancamentos_v2') || localStorage.getItem('controle_notas_standalone_v1');
          if (s) {
            const p = JSON.parse(s);
            if (Array.isArray(p)) return p.map(item => ({ ...item, status: item.status === 'pago' ? 'lancado' : item.status }));
          }
        } catch (e) {}
        return INITIAL_NOTES;
      });

      const [currentTime, setCurrentTime] = useState(new Date());
      const [fridayFilter, setFridayFilter] = useState('current-friday');
      const [customDate, setCustomDate] = useState('');
      const [statusFilter, setStatusFilter] = useState('todos');
      const [searchQuery, setSearchQuery] = useState('');
      const [storeFilter, setStoreFilter] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [toastMsg, setToastMsg] = useState(null);
      const [copiedKey, setCopiedKey] = useState(null);
      const [isErpCollapsed, setIsErpCollapsed] = useState(false);

      const [isFormModalOpen, setIsFormModalOpen] = useState(false);
      const [isReminderModalOpen, setIsReminderModalOpen] = useState(false);
      const [isExportModalOpen, setIsExportModalOpen] = useState(false);
      const [editingNote, setEditingNote] = useState(null);

      const [formData, setFormData] = useState('');
      const [formLojaNum, setFormLojaNum] = useState('');
      const [formLojaNome, setFormLojaNome] = useState('');
      const [formPedido, setFormPedido] = useState('');
      const [formGerado, setFormGerado] = useState('');
      const [formValor, setFormValor] = useState('');
      const [formStatus, setFormStatus] = useState('pendente');
      const [formObs, setFormObs] = useState('');

      const [whatsappPhone, setWhatsappPhone] = useState('085991677572');
      const [userEmail, setUserEmail] = useState('camilasousa@bvpinheiro.com.br');
      const [notifyTime, setNotifyTime] = useState('08:00');
      const [reminderTab, setReminderTab] = useState('automatic');

      useEffect(() => {
        localStorage.setItem('controle_notas_lancamentos_v2', JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const copyToClipboard = (text, label, key) => {
        navigator.clipboard.writeText(text);
        setCopiedKey(key);
        showToast(`${label} copiado: ${text}`);
        setTimeout(() => setCopiedKey(null), 2000);
      };

      const upcomingFriday = useMemo(() => getUpcomingFriday(), []);
      const nextFriday = useMemo(() => getNextFridayAfter(upcomingFriday), [upcomingFriday]);
      const upcomingFridayIso = useMemo(() => formatDateToISO(upcomingFriday), [upcomingFriday]);
      const nextFridayIso = useMemo(() => formatDateToISO(nextFriday), [nextFriday]);

      const storesList = useMemo(() => {
        const map = new Map();
        notes.forEach(n => {
          if (n.lojaNumero && !map.has(n.lojaNumero)) map.set(n.lojaNumero, n.lojaNome);
        });
        return Array.from(map.entries()).map(([numero, nome]) => ({ numero, nome })).sort((a,b) => a.numero.localeCompare(b.numero, undefined, { numeric: true }));
      }, [notes]);

      const filteredNotes = useMemo(() => {
        return notes.filter(n => {
          if (fridayFilter === 'current-friday' && n.data !== upcomingFridayIso) return false;
          if (fridayFilter === 'next-friday' && n.data !== nextFridayIso) return false;
          if (fridayFilter === 'all-fridays' && !isFriday(n.data)) return false;
          if (fridayFilter === 'custom-friday' && customDate && n.data !== customDate) return false;
          if (statusFilter !== 'todos' && n.status !== statusFilter) return false;
          if (storeFilter && n.lojaNumero !== storeFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return n.lojaNome.toLowerCase().includes(q) ||
                   n.lojaNumero.toLowerCase().includes(q) ||
                   n.numeroPedido.toLowerCase().includes(q) ||
                   n.numeroGerado.toLowerCase().includes(q) ||
                   (n.observacoes || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [notes, fridayFilter, customDate, statusFilter, storeFilter, searchQuery, upcomingFridayIso, nextFridayIso]);

      const stats = useMemo(() => {
        let total = 0, lancado = 0, pendente = 0, countLancado = 0, countPendente = 0;
        filteredNotes.forEach(n => {
          total += n.valor;
          if (n.status === 'lancado') {
            lancado += n.valor;
            countLancado++;
          } else {
            pendente += n.valor;
            countPendente++;
          }
        });
        const percent = total > 0 ? Math.round((lancado / total) * 100) : 0;
        return { total, lancado, pendente, countLancado, countPendente, totalCount: filteredNotes.length, percent };
      }, [filteredNotes]);

      const currentFilterLabel = useMemo(() => {
        if (fridayFilter === 'current-friday') return `Sexta-feira (${formatDateBR(upcomingFridayIso)})`;
        if (fridayFilter === 'next-friday') return `Próxima Sexta (${formatDateBR(nextFridayIso)})`;
        if (fridayFilter === 'all-fridays') return 'Todas as Sextas-feiras';
        if (fridayFilter === 'custom-friday' && customDate) return `Data ${formatDateBR(customDate)}`;
        return 'Todas as Datas';
      }, [fridayFilter, upcomingFridayIso, nextFridayIso, customDate]);

      const toggleStatus = (id) => {
        setNotes(prev => prev.map(n => {
          if (n.id === id) {
            const next = n.status === 'lancado' ? 'pendente' : 'lancado';
            showToast(next === 'lancado' ? `Nota Loja ${n.lojaNumero} marcada como LANÇADA (verde)` : `Nota Loja ${n.lojaNumero} marcada como PENDENTE (vermelho)`);
            return { ...n, status: next, lancadoEm: next === 'lancado' ? new Date().toISOString() : undefined };
          }
          return n;
        }));
      };

      const handleBatchSetStatus = (status) => {
        const isLanc = status === 'lancado';
        setNotes(prev => prev.map(n => selectedIds.includes(n.id) ? { ...n, status, lancadoEm: isLanc ? (n.lancadoEm || new Date().toISOString()) : undefined } : n));
        showToast(`${selectedIds.length} notas marcadas como ${isLanc ? 'LANÇADAS' : 'PENDENTES'}.`);
        setSelectedIds([]);
      };

      const handleBatchDelete = () => {
        if (confirm(`Deseja excluir as ${selectedIds.length} notas selecionadas?`)) {
          setNotes(prev => prev.filter(n => !selectedIds.includes(n.id)));
          showToast(`${selectedIds.length} notas excluídas.`);
          setSelectedIds([]);
        }
      };

      const openEdit = (n) => {
        setEditingNote(n);
        setFormData(n.data);
        setFormLojaNum(n.lojaNumero);
        setFormLojaNome(n.lojaNome);
        setFormPedido(n.numeroPedido);
        setFormGerado(n.numeroGerado);
        setFormValor(n.valor.toString());
        setFormStatus(n.status);
        setFormObs(n.observacoes || '');
        setIsFormModalOpen(true);
      };

      const openNew = () => {
        setEditingNote(null);
        setFormData(upcomingFridayIso);
        setFormLojaNum('');
        setFormLojaNome('');
        setFormPedido('');
        setFormGerado('');
        setFormValor('');
        setFormStatus('pendente');
        setFormObs(ERP_DEFAULTS.obsTemplate.replace('{LOJA}', 'X').replace('{PERIODO}', 'Y'));
        setIsFormModalOpen(true);
      };

      const handleSaveNote = (e) => {
        e.preventDefault();
        const v = parseFloat(formValor.replace(',', '.'));
        if (!formData || !formLojaNum.trim() || !formLojaNome.trim() || !formPedido.trim() || !formGerado.trim() || isNaN(v) || v <= 0) {
          alert('Por favor preencha todos os campos corretamente!');
          return;
        }

        if (editingNote) {
          setNotes(prev => prev.map(n => n.id === editingNote.id ? {
            ...n,
            data: formData,
            lojaNumero: formLojaNum.trim(),
            lojaNome: formLojaNome.trim(),
            numeroPedido: formPedido.trim(),
            numeroGerado: formGerado.trim(),
            valor: v,
            status: formStatus,
            observacoes: formObs.trim(),
            lancadoEm: formStatus === 'lancado' ? (n.lancadoEm || new Date().toISOString()) : undefined,
          } : n));
          showToast(`Lançamento da Loja ${formLojaNum} atualizado!`);
        } else {
          setNotes(prev => [{
            id: 'n-' + Date.now(),
            data: formData,
            lojaNumero: formLojaNum.trim(),
            lojaNome: formLojaNome.trim(),
            numeroPedido: formPedido.trim(),
            numeroGerado: formGerado.trim(),
            valor: v,
            status: formStatus,
            observacoes: formObs.trim() || `REF. CONTROLE DE ENTREGAS LOJA ${formLojaNum} PERIODO SEMANAL.`,
            lancadoEm: formStatus === 'lancado' ? new Date().toISOString() : undefined,
            criadoEm: new Date().toISOString(),
          }, ...prev]);
          showToast(`Novo lançamento da Loja ${formLojaNum} cadastrado com sucesso!`);
        }
        setIsFormModalOpen(false);
      };

      const dispatchWhatsApp = () => {
        const pending = filteredNotes.filter(n => n.status === 'pendente');
        let text = `🔔 *LEMBRETE DE LANÇAMENTO DE NOTAS (SEXTA-FEIRA)*\n`;
        text += `📅 *Referência:* ${currentFilterLabel}\n\n`;
        text += `📌 *Dados Fixos ERP:*\n• Ag. Orçamento: 196\n• Fornecedor: 11697-1\n• Agenda: 349\n• CFOP: 820\n\n`;

                  <div className="border border-neutral-200 rounded-xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center"><IconSpreadsheet /></div>
                      <div>
                        <h4 className="text-xs font-bold">Planilha Excel / CSV</h4>
                        <p className="text-[11px] text-neutral-500">Com acentos UTF-8 e colunas formatadas.</p>
                      </div>
                    </div>
                    <button onClick={exportCSV} className="px-3 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-white rounded-lg text-xs font-semibold cursor-pointer">Baixar CSV</button>
                  </div>
                  <div className="border border-neutral-200 rounded-xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg bg-blue-100 text-blue-800 flex items-center justify-center"><IconPrinter /></div>
                      <div>
                        <h4 className="text-xs font-bold">Imprimir ou Salvar em PDF</h4>
                        <p className="text-[11px] text-neutral-500">Folha formatada para assinatura e conferência.</p>
                      </div>
                    </div>
                    <button onClick={() => window.print()} className="px-3 py-1.5 bg-white border border-neutral-300 text-neutral-800 rounded-lg text-xs font-semibold cursor-pointer">Imprimir</button>
                  </div>
                </div>
                <div className="px-6 py-3.5 bg-neutral-50 border-t border-neutral-200 flex justify-end">
                  <button onClick={() => setIsExportModalOpen(false)} className="px-4 py-2 text-xs font-semibold text-neutral-700 hover:text-neutral-900 rounded-lg">Fechar</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-2.5 bg-neutral-900 text-white text-xs font-semibold rounded-xl shadow-lg border border-neutral-800">
              <IconCheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMsg}</span>
              <button onClick={() => setToastMsg(null)} className="ml-2 text-neutral-400 hover:text-white p-0.5">✕</button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
